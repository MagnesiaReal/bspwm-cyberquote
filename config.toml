# bspwm-cyberquote — default configuration
# Place at: ~/.config/bspwm-cyberquote/config.toml
# (Agent 1 declares CONFIG_PATH = /etc/bspwm-cyberquote/config.toml for the
#  system-wide path; override the path in main.rs if you prefer a per-user file.)

[display]
font = "JetBrains Mono, monospace"
font_size = 37
# Optional: author (attribution) font size in px.  Omit to match font_size.
author_font_size = 24
# Text justification of the quote lines AND author inside the centered block:
# "left" | "center" (default) | "right"
# In left/right mode the author anchors to the quote's block edge.
text_alignment = "left"
opacity = 0.96
background_color = "#05070d"
foreground_color = "#ffffff"

[accent]
orange = "#ffe3b3"
author_color = "#F4E394"
cursor_color = "#F4E394"
scanline_opacity = 0.20
scanline_steps = 2160
scanline_lines = 208
scanline_size_rem = 0.5
crt_curvature = 0.15

[glitch]
color_a = "#f556aa"
color_b = "#fadb4d"
glitch_intensity = 0.35
glitch_duration = 0.5
glitch_interval = 6.5
interval_min_seconds = 2.0
interval_max_seconds = 10.0

[glow]
enabled = true
color = "#FFFFFF"
radius = 16.0
intensity = 0.49
thickness = 1.0

[quotes]
# Relative to the working directory, or an absolute path.
source = "quotes.json"
cycle_interval_minutes = 0
picker = "random"

[monitors]
behavior = "one_per_monitor"
primary_only = false
