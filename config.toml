# bspwm-cyberquote — default configuration
# Place at: ~/.config/bspwm-cyberquote/config.toml
# (Agent 1 declares CONFIG_PATH = /etc/bspwm-cyberquote/config.toml for the
#  system-wide path; override the path in main.rs if you prefer a per-user file.)

[display]
font = "JetBrains Mono, monospace"
font_size = 37
# Optional: author (attribution) font size in px.  Omit to match font_size.
author_font_size = 24
# Text justification of the quote lines AND author inside the centered block:
# "left" | "center" (default) | "right"
# In left/right mode the author anchors to the quote's block edge.
text_alignment = "left"
opacity = 0.96
background_color = "#05070d"
foreground_color = "#ffffff"

[accent]
orange = "#ffe3b3"
author_color = "#F4E394"
cursor_color = "#F4E394"
scanline_opacity = 0.20
scanline_steps = 2000
scanline_lines = 200
scanline_size_rem = 0.5
crt_curvature = 0.15

[glitch]
color_a = "#f556aa"
color_b = "#fadb4d"
glitch_intensity = 0.35
glitch_duration = 0.5
glitch_interval = 6.5
interval_min_seconds = 2.0
interval_max_seconds = 10.0

[glow]
enabled = true
color = "#FFFFFF"
radius = 16.0
intensity = 0.49
thickness = 1.0

[squares]
# Floating glitched squares drifting from the bottom of the screen toward the
# middle, fading in as they emerge from the "birth" gradient and back out
# before they reach the text band.  Each square randomly fires a short
# chromatic glitch burst (color_a/color_b echoes, like the text glitch).
enabled = true
color = "#ffffff"
opacity = 0.7
# Base drift speed (px/sec) for a square at the reference size (~half the font
# height).  Squares use a random size between SQUARE_MIN_PX and 0.8×font; each
# one's speed scales proportionally with its size (small/far-away = slow,
# large/close = fast).
speed = 36
max_particles = 50
spawn_rate = 0.12
glitch_interval_min_seconds = 1.0
glitch_interval_max_seconds = 4.5
glitch_duration_steps = 4
# Soft white-to-transparent band at the bottom of the screen marking where the
# squares are "born".  The gradient is linear: fully transparent at its top
# edge, reaching `gradient_intensity` at the very bottom of the screen.
gradient = true
# Where the gradient *ends* (fades out): band height as a fraction of the
# screen height.  0.25 = glow covers the bottom quarter, ends at 75% up the
# screen; smaller = a short sharp band near the bottom; larger = climbs higher.
gradient_height = 0.48
# Peak opacity at the very bottom edge (0.0 = invisible, 1.0 = solid).  The
# band fades linearly from this at the bottom to 0 at the top of the band.
gradient_intensity = 0.18

[quotes]
# Relative to the working directory, or an absolute path.
source = "quotes.json"
cycle_interval_minutes = 0
picker = "random"

[monitors]
behavior = "one_per_monitor"
primary_only = false
