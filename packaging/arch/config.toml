# bspwm-cyberquote-native — packaged default configuration.
# Installed by the Arch package to /etc/bspwm-cyberquote/config.toml.
# On first run the app copies this to ~/.config/bspwm-cyberquote/config.toml;
# edit the ~/.config copy to personalize (it takes precedence).

[display]
font = "JetBrains Mono, monospace"
font_size = 37
opacity = 0.96
background_color = "#05070d"
foreground_color = "#ffffff"

[accent]
orange = "#ffe3b3"
author_color = "#F4E394"
cursor_color = "#F4E394"
scanline_opacity = 0.20
scanline_steps = 2160
scanline_lines = 216
scanline_size_rem = 0.2
crt_curvature = 0.15

[glitch]
color_a = "#f556aa"
color_b = "#fadb4d"
glitch_intensity = 0.35
glitch_duration = 0.5
glitch_interval = 6.5
interval_min_seconds = 2.0
interval_max_seconds = 10.0

[glow]
enabled = true
color = "#FFFFFF"
radius = 15.0
intensity = 0.48
thickness = 1.0

[quotes]
# Absolute path to the quote pool shipped with the package. Point this at your
# own file to use a personal list.
source = "/usr/share/bspwm-cyberquote-native/quotes.json"
cycle_interval_minutes = 0
picker = "random"

[monitors]
behavior = "one_per_monitor"
primary_only = false